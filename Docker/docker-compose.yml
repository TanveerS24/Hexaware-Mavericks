# ==============================================================================
# Citizen Call Intelligence Platform - Docker Compose Stack
# ==============================================================================
# CENTRALIZED API GATEWAY & NETWORK PORTS (0.0.0.0):
# Teammates can connect directly to the API Gateway at: http://<YOUR-IP>:8000
#
#   PORT 8000  -> Centralized API Gateway  (Docs: http://<IP>:8000/docs)
#                 - Citizen Portal:      http://<IP>:8000/citizen/...
#                 - Call Centre Portal:  http://<IP>:8000/callcentre/...
#                 - Officer Portal:      http://<IP>:8000/officer/...
#                 - Admin Dashboard:     http://<IP>:8000/admin/...
#   PORT 5432  -> PostgreSQL with pgvector
#   PORT 8001  -> Citizen Portal API direct
#   PORT 8002  -> Call Centre Portal API direct
#   PORT 8003  -> Officer Portal API direct
#   PORT 8004  -> Admin Dashboard API direct
#
# *Note: Ollama is running directly on the host machine at localhost:11434.
# Containers connect to it via host.docker.internal:11434.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database with pgvector extension
  # ----------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: grievance_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-grievance_db}
    ports:
      - "0.0.0.0:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-grievance_db}"]
      interval: 3s
      timeout: 5s
      retries: 10
    networks:
      - platform_net

  # ----------------------------------------------------------------------------
  # Centralized API Gateway (Port 8000) - Primary Entry Point for Frontends
  # ----------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: api_gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/grievance_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_net

  # ----------------------------------------------------------------------------
  # Citizen Portal API (Port 8001)
  # ----------------------------------------------------------------------------
  citizen-api:
    build:
      context: .
      dockerfile: Dockerfile.citizen
    container_name: citizen_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/grievance_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_net

  # ----------------------------------------------------------------------------
  # Call Centre Portal API (Port 8002)
  # ----------------------------------------------------------------------------
  callcentre-api:
    build:
      context: .
      dockerfile: Dockerfile.callcentre
    container_name: callcentre_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/grievance_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_net

  # ----------------------------------------------------------------------------
  # Officer Portal API (Port 8003)
  # ----------------------------------------------------------------------------
  officer-api:
    build:
      context: .
      dockerfile: Dockerfile.officer
    container_name: officer_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/grievance_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_net

  # ----------------------------------------------------------------------------
  # Admin Dashboard API (Port 8004)
  # ----------------------------------------------------------------------------
  admin-api:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: admin_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/grievance_db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "0.0.0.0:8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - platform_net

# ------------------------------------------------------------------------------
# Volumes and Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: grievance_postgres_data

networks:
  platform_net:
    driver: bridge
